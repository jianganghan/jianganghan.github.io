<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" role="img">
<defs><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ah-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5179e"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs>
<rect width="880" height="356" fill="#ffffff"/>
<text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="600">一次出价是怎么来的</text>
<rect x="20" y="80" width="210" height="86" rx="10" fill="#9ca3af" fill-opacity="0.1" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="125.0" y="119.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="16.5" fill="#1f2328" text-anchor="middle" font-weight="600">预估模型</text>
<text x="125.0" y="142.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">pCTR、pCVR × 价值</text>
<rect x="335" y="80" width="210" height="86" rx="10" fill="#4f46e5" fill-opacity="0.07" stroke="#4f46e5" stroke-width="1.6"/>
<text x="440.0" y="119.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="16.5" fill="#4f46e5" text-anchor="middle" font-weight="600">出价 b = α × v</text>
<text x="440.0" y="142.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">bidding · 每次曝光算一次</text>
<rect x="650" y="80" width="210" height="86" rx="10" fill="#e8590c" fill-opacity="0.07" stroke="#e8590c" stroke-width="1.6"/>
<text x="755.0" y="119.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="16.5" fill="#e8590c" text-anchor="middle" font-weight="600">平台拍卖</text>
<text x="755.0" y="142.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">pricing · 计价规则和底价</text>
<rect x="335" y="236" width="210" height="80" rx="10" fill="#b5179e" fill-opacity="0.07" stroke="#b5179e" stroke-width="1.6"/>
<text x="440.0" y="272.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="16.5" fill="#b5179e" text-anchor="middle" font-weight="600">预算平滑</text>
<text x="440.0" y="295.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">pacing · 每几分钟调一次 α</text>
<text x="20" y="69" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="start" font-weight="600">本专题不展开</text>
<text x="335" y="69" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" fill="#4f46e5" text-anchor="start" font-weight="600">第 1、2 篇</text>
<text x="650" y="69" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" fill="#e8590c" text-anchor="start" font-weight="600">第 1 篇</text>
<text x="325" y="280.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13" fill="#b5179e" text-anchor="end" font-weight="600">第 3 篇</text>
<path d="M232,123.0 L332,123.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah-gray)"/>
<text x="282.5" y="114.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">v：这次值多少</text>
<path d="M547,123.0 L647,123.0" fill="none" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#ah-indigo)"/>
<text x="597.5" y="114.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">报价 b</text>
<path d="M440.0,234 L440.0,169" fill="none" stroke="#b5179e" stroke-width="1.6" marker-end="url(#ah-magenta)"/>
<text x="450.0" y="205.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#b5179e" text-anchor="start" font-weight="400">α：整体出多高</text>
<path d="M755.0,168 L755.0,276.0 L548,276.0" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="656.0" y="267.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">赢没赢、付多少 → 花费进度</text>
<text x="440.0" y="342" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">预估模型给出 v，pacing 给出 α，相乘就是报价；平台按计价规则决定赢没赢、付多少，花费进度再反馈回去调 α</text>
</svg>
