<text x="755.0" y="142.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">pricing · rules &amp; reserve price</text>
