<text x="656.0" y="267.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400">wins &amp; costs → spend progress</text>
<text x="440.0" y="342" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">Prediction gives v and pacing gives α; the bid is their product. The auction rules decide wins and costs, and spend feeds back to adjust α</text>
