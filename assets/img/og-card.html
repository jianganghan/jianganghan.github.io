<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bg:#ffffff; --text:#24292f; --title:#111418; --muted:#6b7280; --line:#e8e8e6; --link:#1f6feb; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1200px; height:630px; }
  body{
    background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:92px 92px 84px; position:relative;
  }
  .accent{ position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--link); }
  h1{ font-size:82px; font-weight:700; color:var(--title); letter-spacing:-.03em; line-height:1; }
  .tagline{ margin-top:26px; font-size:30px; color:var(--muted); white-space:nowrap; }
  .topics{
    display:flex; align-items:center; gap:26px;
    font-size:38px; font-weight:600; color:var(--text); letter-spacing:-.01em;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--link); flex:none; }
  .foot{ display:flex; align-items:baseline; justify-content:space-between; }
  .url{ font-size:28px; color:var(--link); }
  .parts{ font-size:24px; color:var(--muted); }
</style>
</head>
<body>
  <div class="accent"></div>

  <div>
    <h1>Jiangang Han</h1>
    <div class="tagline">What I’ve Learned and Built, and What I’m Learning and Building</div>
  </div>

  <div class="topics">
    <span>Ad Bidding</span><span class="dot"></span>
    <span>Price Optimization</span><span class="dot"></span>
    <span>AI Reliability</span>
  </div>

  <div class="foot">
    <span class="url">jianganghan.github.io</span>
    <span class="parts">English · 中文</span>
  </div>
</body>
</html>
